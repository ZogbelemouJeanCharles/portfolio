/* ---------- utilitaires ---------- */
const rng = s => () => { s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
const R = rng(1912);
const rr = (a,b)=>a+R()*(b-a);
const mk = (w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const tex = (c,srgb=true)=>{const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t};
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));return `rgb(${f(r)},${f(g)},${f(b)})`}
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

/* =====================================================================

const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;

const scene=new THREE.Scene();
scene.fog=new THREE.Fog('#f6c784',22,130);
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;
scene.environmentIntensity=.5;
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.05,900);

// soleil au bout de la rue, haut dans le ciel : contre-jour doré
const SUN_DIR=V(.06,.42,-1).normalize();
const sky=new THREE.Mesh(new THREE.SphereGeometry(600,32,16),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{sunDir:{value:SUN_DIR}},
  vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vD;uniform vec3 sunDir;
    void main(){vec3 d=normalize(vD);float h=d.y;
      vec3 top=vec3(.45,.55,.66),mid=vec3(1.,.82,.56),hor=vec3(1.25,.86,.52);
      vec3 c=mix(hor,mid,smoothstep(0.,.3,h));c=mix(c,top,smoothstep(.35,1.,h));
      float s=max(dot(d,sunDir),0.);
      c+=vec3(1.,.72,.38)*pow(s,4.)*1.1+vec3(1.,.9,.7)*pow(s,40.)*2.5+vec3(1.,.97,.9)*pow(s,600.)*8.;
      gl_FragColor=vec4(c,1.);}`}));
scene.add(sky);

scene.add(new THREE.HemisphereLight('#ffd9a0','#5a2a12',.6));
const sun=new THREE.DirectionalLight('#ffd08a',4.2);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:80});
sun.shadow.bias=-.0005;sun.shadow.normalBias=.03;
scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight('#ffb878',.9);fill.position.set(6,5,14);scene.add(fill);

/* =====================================================================
   LA RUE
   ===================================================================== */
const WALL_L=-3.8, WALL_R=4.4;
const PALETTE=['#d9b48a','#c98f6a','#e2c49a','#a8574a','#cdb08a','#b9876a','#9a9a76','#e8d2a8','#c7a07a'];
const SHOPS=['GROCERIES','DELICATESSEN','BARBER SHOP','FINK MFG. CO.','LUTECE & CIE','HOTEL COLUMBIA','POST OFFICE','THEATRE','PHARMACY','BOOKS','RAFFLE & FAIR','SODA FOUNTAIN'];
const SHOP_COL=['#2f4a3a','#6b1f1a','#24344f','#4a2a16'];

function glass(x,X,Y,W,H,arch){
  x.save();x.beginPath();
  if(arch){x.moveTo(X,Y+H);x.lineTo(X,Y+W/2);x.arc(X+W/2,Y+W/2,W/2,Math.PI,0);x.lineTo(X+W,Y+H);x.closePath()}else x.rect(X,Y,W,H);
  x.fillStyle='#ead9b8';x.fill();x.clip();
  const g=x.createLinearGradient(X,Y,X+W,Y+H);g.addColorStop(0,'#c7a27a');g.addColorStop(.4,'#4a3a33');g.addColorStop(1,'#20180f');
  x.fillStyle=g;x.fillRect(X+6,Y+6,W-12,H-12);
  x.fillStyle='rgba(255,220,160,.22)';x.beginPath();x.moveTo(X+W*.1,Y+H);x.lineTo(X+W*.5,Y);x.lineTo(X+W*.72,Y);x.lineTo(X+W*.32,Y+H);x.fill();
  x.strokeStyle='#ead9b8';x.lineWidth=4;x.beginPath();x.moveTo(X+W/2,Y);x.lineTo(X+W/2,Y+H);x.moveTo(X,Y+H*.55);x.lineTo(X+W,Y+H*.55);x.stroke();
  x.restore();
}
function facadeTexture(w,h,base,shop,shopCol,brick){
  const ppu=72,cw=Math.round(w*ppu),ch=Math.round(h*ppu),c=mk(cw,ch),x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,cw,ch);
  if(brick){for(let y=0,r=0;y<ch;y+=11,r++)for(let xx=-(r%2)*14;xx<cw;xx+=28){x.fillStyle=`rgba(${R()<.5?'120,50,30':'255,230,190'},${rr(.03,.12)})`;x.fillRect(xx+1,y+1,26,9)}}
  else{x.strokeStyle='rgba(60,30,10,.06)';for(let y=0;y<ch;y+=36){x.beginPath();x.moveTo(0,y);x.lineTo(cw,y);x.stroke()}}
  let g=x.createLinearGradient(0,0,0,ch);g.addColorStop(0,'rgba(255,235,200,.15)');g.addColorStop(1,'rgba(40,15,0,.25)');x.fillStyle=g;x.fillRect(0,0,cw,ch);
  const gf=3.3*ppu,gy=ch-gf;
  x.fillStyle=shade(base,-.35);x.fillRect(0,gy,cw,gf);
  x.fillStyle=shopCol;x.fillRect(.3*ppu,gy+.18*ppu,cw-.6*ppu,.62*ppu);
  x.strokeStyle='#d4aa5c';x.lineWidth=3;x.strokeRect(.3*ppu+4,gy+.18*ppu+4,cw-.6*ppu-8,.62*ppu-8);
  x.save();x.font=`500 ${.44*ppu}px Oswald`;x.fillStyle='#e8c47a';x.textAlign='center';x.textBaseline='middle';if('letterSpacing' in x)x.letterSpacing='3px';
  x.fillText(shop,cw/2,gy+.5*ppu);x.restore();
  glass(x,.45*ppu,gy+1.0*ppu,cw*.58,gf-1.15*ppu,false);
  x.fillStyle='#2a1a10';x.fillRect(cw*.72,gy+1.0*ppu,cw*.16,gf-1.0*ppu);
  x.fillStyle=shade(base,-.45);x.fillRect(0,0,cw,.55*ppu);
  x.fillStyle=shade(base,.2);for(let i=6;i<cw;i+=18)x.fillRect(i,.55*ppu,9,12);
  x.fillStyle=shade(base,-.2);x.fillRect(0,.55*ppu+12,cw,7);
  const floors=Math.max(1,Math.floor((h-3.3-.7)/2.6)),n=Math.max(2,Math.floor(w/1.7)),sp=cw/n;
  for(let f=0;f<floors;f++){const top=gy-(f+1)*2.6*ppu;
    x.fillStyle=shade(base,.28);x.fillRect(0,gy-f*2.6*ppu-9,cw,9);
    for(let i=0;i<n;i++){const wx=sp*(i+.5)-.42*ppu;
      x.fillStyle=shade(base,.3);x.fillRect(wx-10,top+.3*ppu,.84*ppu+20,14);
      glass(x,wx,top+.45*ppu,.84*ppu,1.6*ppu,f%2===0);
      x.fillStyle=shade(base,-.3);x.fillRect(wx-8,top+2.05*ppu,.84*ppu+16,10);}}
  return tex(c);
}
function awningTexture(col){const c=mk(256,128),x=c.getContext('2d');
  for(let i=0;i<8;i++){x.fillStyle=i%2?'#efe3c4':col;x.fillRect(i*32,0,32,128)}
  x.fillStyle='rgba(0,0,0,.2)';x.fillRect(0,104,256,24);return tex(c)}
const stoneMat=new THREE.MeshStandardMaterial({color:'#e6d3ae',roughness:.85});
function building(side,z0,w,h,i){
  const d=6,base=PALETTE[i%PALETTE.length];
  const face=new THREE.MeshStandardMaterial({map:facadeTexture(w,h,base,SHOPS[i%SHOPS.length],SHOP_COL[i%SHOP_COL.length],i%3===0),roughness:.85});
  const plain=new THREE.MeshStandardMaterial({color:shade(base,-.15),roughness:.95});
  const m=new THREE.Mesh(new THREE.BoxGeometry(d,h,w),side<0?[face,plain,plain,plain,plain,plain]:[plain,face,plain,plain,plain,plain]);
  const wx=side<0?WALL_L-d/2:WALL_R+d/2;
  m.position.set(wx,h/2,z0-w/2);m.castShadow=m.receiveShadow=true;scene.add(m);
  const cor=new THREE.Mesh(new THREE.BoxGeometry(d+.8,.4,w+.1),new THREE.MeshStandardMaterial({color:shade(base,-.4),roughness:.8}));
  cor.position.set(wx,h+.1,z0-w/2);cor.castShadow=true;scene.add(cor);
  if(i%3!==1){const aw=new THREE.Mesh(new THREE.PlaneGeometry(w*.62,1.3),new THREE.MeshStandardMaterial({map:awningTexture(['#a8322a','#2f5a44','#2e4a78'][i%3]),side:THREE.DoubleSide,roughness:.9}));
    aw.position.set((side<0?WALL_L:WALL_R)-side*.55,3.1,z0-w*.36);aw.rotation.y=side<0?Math.PI/2:-Math.PI/2;aw.rotateX(-1.0);aw.castShadow=true;scene.add(aw)}
}
for(const side of [-1,1]){let z=26,i=side<0?0:5;while(z>-80){const w=rr(5,8.5),h=rr(9,16);building(side,z,w,h,i++);z-=w+.02}}

// sol pavé chaud
{
  const c=mk(512,512),x=c.getContext('2d');x.fillStyle='#6e3f28';x.fillRect(0,0,512,512);
  for(let y=0;y<512;y+=32)for(let xx=-(y/32%2)*24;xx<512;xx+=48){x.fillStyle=`hsl(${rr(14,28)},${rr(30,45)}%,${rr(38,52)}%)`;x.beginPath();x.roundRect(xx+3,y+3,42,26,9);x.fill()}
  const t=tex(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(4,48);
  const g=new THREE.Mesh(new THREE.PlaneGeometry(WALL_R-WALL_L,120),new THREE.MeshStandardMaterial({map:t,roughness:.75,metalness:.05}));
  g.rotation.x=-Math.PI/2;g.position.set((WALL_L+WALL_R)/2,0,-23);g.receiveShadow=true;scene.add(g);
  for(const [x0,x1] of [[WALL_L,WALL_L+1.3],[WALL_R-1.3,WALL_R]]){const s=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,.18,100),stoneMat);s.position.set((x0+x1)/2,.09,-33);s.receiveShadow=true;scene.add(s)}
}
// balustrade (bout de la rue + premier plan de l'écran titre)
const balGeo=new THREE.LatheGeometry([[0,0],[.075,0],[.075,.07],[.05,.11],[.095,.33],[.05,.55],[.04,.62],[.075,.66],[.075,.72],[0,.72]].map(([a,b])=>new THREE.Vector2(a,b)),14);
function balustrade(z,x0,x1){
  const n=Math.floor((x1-x0)/.3),im=new THREE.InstancedMesh(balGeo,stoneMat,n),m=new THREE.Matrix4();
  for(let i=0;i<n;i++){m.makeTranslation(x0+.15+i*.3,.12,z);im.setMatrixAt(i,m)}im.castShadow=im.receiveShadow=true;scene.add(im);

  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float time;varying vec2 vUv;
    void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;float l=dot(c,vec3(.299,.587,.114));
      vec3 warmSh=vec3(1.08,.86,.66),warmHi=vec3(1.05,.97,.84);c*=mix(warmSh,warmHi,smoothstep(.2,.9,l));
      c=mix(vec3(l),c,1.1);c=(c-.5)*1.05+.52;
      float v=length((vUv-vec2(.5,.45))*vec2(1.,.85));c*=mix(1.,.55,smoothstep(.35,.95,v));
      c+=(fract(sin(dot(vUv*1000.+time,vec2(12.9898,78.233)))*43758.5)-.5)*.025;
      gl_FragColor=vec4(c,1.);}`});
composer.addPass(grade);

addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();PRE=presets();setState(UI.state)});

/* =====================================================================
   BOUCLE
   ===================================================================== */
const clock=new THREE.Clock(),sunW=V(0,0,0),perf={acc:0,n:0,pr:Math.min(devicePixelRatio,1.5)};
function spring(s,target,k,damp,dt){s.v+=(target-s.x)*k*dt;s.v*=Math.exp(-damp*dt);s.x+=s.v*dt}
function loop(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  const k=1-Math.exp(-dt*(UI.state==='title'?1.1:2.3));
  cam.pos.lerp(camT.pos,k);cam.look.lerp(camT.look,k);
  const px=reduced?0:mouseN.x,py=reduced?0:mouseN.y;
  camera.position.set(cam.pos.x+px*.2,cam.pos.y+py*.1,cam.pos.z);camera.lookAt(cam.look);
  // soleil qui suit la caméra (ombres nettes là où on regarde)
  sun.target.position.set(camera.position.x,0,camera.position.z-8);sun.position.copy(sun.target.position).addScaledVector(SUN_DIR,40);
  // enseigne
  spring(yaw,yaw.t+(UI.state==='menu'?px*.05:0),26,5.5,dt);
  spring(swing,(reduced?0:Math.sin(t*.8)*.018)-(UI.state!=='title'&&hovered?.03:0),18,2.4,dt);
  spring(roll,reduced?0:Math.sin(t*.55+1)*.008,22,2.8,dt);
  hang.rotation.set(swing.x,yaw.x,roll.x);
  if(UI.state!=='title'){const h=pick(),id=h&&(h.act||UI.page==='skills')?h.id:null;
    if(pointerMoved&&id!==hovered){hovered=id;if(id)select(id,false)}canvas.style.cursor=h&&h.act?'pointer':'default';pointerMoved=false}
  if(UI.animating)redraw();
  updateLiz(dt,t,px,py);updateCoins(dt);
  if(UI.state!=='title'&&lizPicked())canvas.style.cursor='pointer';
  // décor
  updateFlags(t);
  starFlags.forEach((f,i)=>{f.rotation.x=Math.sin(t*1.2+i)*.08});
  islands.forEach(i=>i.g.position.y=i.y+Math.sin(t*i.sp+i.ph)*1.2);
  clouds.forEach((c,i)=>{c.position.x+=dt*(.6+i%5*.15);if(c.position.x>170)c.position.x=-170});
  dust.rotation.y=t*.008;dust.position.y=Math.sin(t*.2)*.15;
  // position écran du soleil pour les rayons
  sunW.copy(camera.position).addScaledVector(SUN_DIR,400).project(camera);
  rays.uniforms.sunPos.value.set(sunW.x*.5+.5,sunW.y*.5+.5);
  rays.uniforms.strength.value=sunW.z<1?THREE.MathUtils.clamp(1.6-Math.max(Math.abs(sunW.x),Math.abs(sunW.y))*.5,0,1.6):0;
  grade.uniforms.time.value=t%10;
  // qualité adaptative : baisse la résolution si l'animation rame (PC portables, GPU intégrés)
  perf.acc+=dt;perf.n++;
  if(perf.acc>2){const avg=perf.acc/perf.n;perf.acc=perf.n=0;
    if(avg>1/40&&perf.pr>.75){perf.pr=Math.max(.75,perf.pr-.25);renderer.setPixelRatio(perf.pr);composer.setPixelRatio?.(perf.pr);composer.setSize(innerWidth,innerHeight)}}
  composer.render();requestAnimationFrame(loop);
}
preparePaper();redraw();loop();
start();
setTimeout(()=>document.body.classList.add('ready'),200);
</script>
</body>
